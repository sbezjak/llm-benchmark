[project]
name = "llm_benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
llm-benchmark-sweep = "llm_benchmark.sweep:main"
llm-benchmark-rejudge = "llm_benchmark.rejudge:main"

[project.optional-dependencies]
tracing = [
    "langfuse>=4.14.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-html>=4",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_benchmark"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = false
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
markers = [
    "mocked: fast unit tests, provider HTTP mocked with respx",
    "live: slow, requires the local Ollama backend at localhost:11434 (free)",
    "billed: hits a PAID provider API (OpenAI/Anthropic) - real spend. Excluded from default runs; opt in explicitly. The spend gate, the way `live` gated the backend in P0-P4.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
